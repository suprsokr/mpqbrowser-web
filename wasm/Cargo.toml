[package]
name = "benilla-web"
version = "0.1.0"
edition = "2021"
description = "The benilla client's MPQ, BLP, M2 and DBC readers, compiled to WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The readers, straight from the client's own crates: no re-implementation in the page. The fork
# carries one commit on top of `samwhosung/benilla` (`mpq-frontend`) whose whole diff is additive:
# the `Source` trait, the schema registry, and the handles a frontend reaches for. `rev` pins it.
benilla-bytes = { git = "https://github.com/suprsokr/benilla", rev = "0226eb1033b2bafbf67bf85a6c893aa90fced8db" }
benilla-mpq = { git = "https://github.com/suprsokr/benilla", rev = "0226eb1033b2bafbf67bf85a6c893aa90fced8db" }
benilla-blp = { git = "https://github.com/suprsokr/benilla", rev = "0226eb1033b2bafbf67bf85a6c893aa90fced8db" }
benilla-dbc = { git = "https://github.com/suprsokr/benilla", rev = "0226eb1033b2bafbf67bf85a6c893aa90fced8db" }
benilla-m2 = { git = "https://github.com/suprsokr/benilla", rev = "0226eb1033b2bafbf67bf85a6c893aa90fced8db" }
# `dev` builds benilla's own source path into the binary; the page has no use for it.
benilla-formats = { git = "https://github.com/suprsokr/benilla", rev = "0226eb1033b2bafbf67bf85a6c893aa90fced8db", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
