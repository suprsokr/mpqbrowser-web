[package]
name = "benilla-web"
version = "0.1.0"
edition = "2021"
description = "The benilla client's MPQ, BLP, M2 and DBC readers, compiled to WebAssembly"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The readers, straight from the client's own workspace: no re-implementation in the page.
benilla-bytes = { path = "../../benilla/crates/benilla-bytes" }
benilla-mpq = { path = "../../benilla/crates/benilla-mpq" }
benilla-blp = { path = "../../benilla/crates/benilla-blp" }
benilla-dbc = { path = "../../benilla/crates/benilla-dbc" }
benilla-m2 = { path = "../../benilla/crates/benilla-m2" }
# `dev` builds benilla's own source path into the binary; the page has no use for it.
benilla-formats = { path = "../../benilla/crates/benilla-formats", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
